kind = "web"
previewPath = "/"
title = "Pita Pit India"
version = "1.0.0"
id = "artifacts/pita-pit-india"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25451

[services.development]
run = "pnpm --filter @workspace/pita-pit-india run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pita-pit-india", "run", "build" ]
publicDir = "artifacts/pita-pit-india/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25451"
BASE_PATH = "/"
